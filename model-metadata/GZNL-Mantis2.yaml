# Register the Mantis 2 model with the Hub. This file must be merged by
# the Hub maintainer BEFORE any weekly forecast PR for GZNL-Mantis2
# can pass validation.
team_name: "GZNL Group"
team_abbr: "GZNL"
model_name: "Mantis 2 COVID Positivity Forecast"
model_abbr: "Mantis2"
model_contributors:
  - name: "GZNL Group"
    affiliation: "GZNL Group"
    email: "liu_hengshen@gzlab.ac.cn"
license: "CC-BY-4.0"
designated_model: true
data_inputs: "中国疾控中心每周发布的《全国急性呼吸道传染病哨点监测情况》报告的门急诊流感样病例中的新型冠状病毒阳性率"
methods: "Mantis 2 foundation model (Chronos-2 backbone, simulation + real data), 16-week horizon, no covariate, applied to the weekly COVID positivity rate"
methods_long: "Attribution: Mantis 2 was developed by Dudley et al. at the University of Michigan (arXiv:2611.16935; open-source code: https://github.com/carsondudley1/Mantis, tag mantis-v2.0.0). GZNL did NOT develop this model; we apply the open-source Mantis 2 as-is, without modifying its weights, architecture, or training, to forecast China's COVID positivity rate and submit the forecasts to this Hub. Mantis 2 is a foundation model built on a Chronos-2 backbone, trained on simulated and real infectious-disease data. It forecasts from the last 512 weekly observations (the series has about 205 weeks) with a 16-week horizon and no covariate; only the first 8 steps map into Hub horizons -1..6 and the rest are discarded. Mantis 2 outputs 21 quantiles (0.01, 0.05, 0.1, 0.15, 0.2, 0.25, 0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 0.99); these are expanded to the Hub's required 23 quantiles by linear interpolation in quantile space for the two missing interior quantiles only (0.025, 0.975), while the 0.01/0.99 tails are native Mantis 2 outputs. Note: Mantis 2 was trained on counts, not on positivity rates, so applying it to a percentage (0-100) is off-label and the first runs should be treated as an experiment; it was backtested on the August 2026 summer peak before submission."
ensemble_of_models: false
ensemble_of_hub_models: false

methods: "Mantis foundation model (simulation-trained CNN-Transformer), 8-week horizon, no covariate, applied to the weekly COVID positivity rate"
methods_long: "Mantis v1 (Dudley et al., PNAS 2026, doi:10.1073/pnas.2602542123; code: https://github.com/carsondudley1/Mantis) is a foundation model trained entirely on mechanistic outbreak simulations. It forecasts from the last 112 weekly observations with an 8-week horizon and no covariate (mantis_8w_nocov.pt), target_type set to cases (the closest of Mantis's cases/hospitalizations/deaths types to a rate). Mantis outputs 9 quantiles (0.05, 0.1, 0.25, 0.4, 0.5, 0.6, 0.75, 0.9, 0.95); these are expanded to the Hub's required 23 quantiles by linear interpolation in quantile space, clamped at the Mantis extremes, so the 0.01/0.99 tails equal the 0.05/0.95 values and are understated. Note: Mantis was trained on counts, not on positivity rates, so applying it to a percentage (0-100) is off-label and the first runs should be treated as an experiment."
ensemble_of_models: false

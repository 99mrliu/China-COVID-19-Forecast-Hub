# Register the Mantis model with the Hub. This file must be merged by
# the Hub maintainer BEFORE any weekly forecast PR for GZNL-Mantis
# can pass validation.
team_name: "GZNL Group"
team_abbr: "GZNL"
model_name: "Mantis COVID Positivity Forecast"
model_abbr: "Mantis"
model_contributors:
  - name: "GZNL Group"
    affiliation: "GZNL Group"
    email: "liu_hengshen@gzlab.ac.cn"
license: "CC-BY-4.0"
designated_model: true
data_inputs: "中国疾控中心每周发布的《全国急性呼吸道传染病哨点监测情况》报告的门急诊流感样病例中的新型冠状病毒阳性率"
methods: "Mantis foundation model (simulation-trained CNN-Transformer), 8-week horizon, no covariate, applied to the weekly COVID positivity rate"
methods_long: "Attribution: Mantis was developed by Dudley et al. at the University of Michigan (PNAS 2026, doi:10.1073/pnas.2602542123; open-source code: https://github.com/carsondudley1/Mantis). GZNL did NOT develop this model; we apply the open-source Mantis v1 as-is, without modifying its weights, architecture, or training, to forecast China's COVID positivity rate and submit the forecasts to this Hub. Mantis v1 is a foundation model trained entirely on mechanistic outbreak simulations. It forecasts from the last 112 weekly observations with an 8-week horizon and no covariate (mantis_8w_nocov.pt), target_type set to cases (the closest of Mantis's cases/hospitalizations/deaths types to a rate). Mantis outputs 9 quantiles (0.05, 0.1, 0.25, 0.4, 0.5, 0.6, 0.75, 0.9, 0.95); these are expanded to the Hub's required 23 quantiles by linear interpolation in quantile space, clamped at the Mantis extremes, so the 0.01/0.99 tails equal the 0.05/0.95 values and are understated. Note: Mantis was trained on counts, not on positivity rates, so applying it to a percentage (0-100) is off-label and the first runs should be treated as an experiment."
ensemble_of_models: false
ensemble_of_hub_models: false

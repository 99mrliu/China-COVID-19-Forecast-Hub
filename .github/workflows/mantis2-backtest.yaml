# Mantis 2 backtest -- Aug 2026 summer peak (MANUAL-ONLY)
#
# Same protocol as the v1 backtest, so the two models are directly
# comparable on the same origins:
# Each origin pretends the data ends 3 weeks before the reference_date
# (the same lag as the live run), so no future information leaks in.
# Actuals are scored afterwards with scripts/score_backtest.py
# (median MAE, WIS, 50%/90% coverage).
#
# Origins (reference_date / as-of / last observed value):
#   2026-07-27 / 2026-07-06 / 11.9%  (still rising)
#   2026-08-03 / 2026-07-13 / 16.3%  (still rising)
#   2026-08-10 / 2026-07-20 / 20.3%  (near peak)
#   2026-08-17 / 2026-07-27 / 22.3%  (peak week)
#   2026-08-24 / 2026-08-03 / 21.1%  (just past peak)
# Actuals after the peak: 22.3 -> 21.1 -> 21.2 -> 19.5 -> 15.8 -> 14.0
# -> 12.5 -> 9.3 -> 7.2 -> 4.9 -> 3.4 -> 2.9 -> 1.9 -> 1.3
#
# v1 results on these origins (2026-11-13, for comparison):
#   MAE 6.78 / 2.70 / 3.27 / 4.71 / 3.58; mean WIS 29.13 / 35.22 /
#   40.25 / 40.89 / 33.51; 50% and 90% coverage 1.0 everywhere.
#   Flat last-value baseline on the 2026-08-24 origin: MAE 8.07,
#   mean WIS 86.34.
#
# Output is an artifact only -- no push, no PR, no schedule.
name: Mantis 2 backtest (Aug 2026 peak)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out this fork
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache Mantis 2 checkpoint
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: models/mantis2
          key: mantis-weights-v2
          restore-keys: |
            mantis-weights-v2-

      - name: Install torch (CPU only) + Mantis 2 deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r scripts/requirements.txt
          python -m pip install "mantis[v2] @ git+https://github.com/carsondudley1/Mantis.git@mantis-v2.0.0"

      - name: Download Mantis 2 checkpoint (only on cache miss)
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: |
          mkdir -p models/mantis2
          release_url="https://github.com/carsondudley1/Mantis/releases/download/mantis-v2.0.0"
          curl -fL "$release_url/config.json" -o models/mantis2/config.json
          curl -fL "$release_url/model.safetensors" -o models/mantis2/model.safetensors
          ls -lh models/mantis2/

      - name: Clone Mantis 2 code (not vendored in the fork)
        run: |
          git clone --depth 1 --branch mantis-2-release https://github.com/carsondudley1/Mantis.git mantis2
          ls mantis2/mantis/v2/

      - name: Fetch latest Hub target data from upstream
        run: |
          mkdir -p target-data
          curl -sL -o target-data/time-series.csv \
            https://raw.githubusercontent.com/dailypartita/China-Infectious-Disease-Forecast-Hub/main/target-data/time-series.csv
          python3 -c "
          import pandas as pd
          df = pd.read_csv('target-data/time-series.csv', parse_dates=['target_end_date'])
          g = df[df['target'] == 'wk inc covid prop ili'].sort_values('target_end_date')
          print(f\"COVID weeks: {len(g)}, last: {g['target_end_date'].max().date()} = {g['observation'].iloc[-1]}%\")
          "

      - name: Run backtest origins + score them
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p backtest2
          for spec in "2026-07-27 2026-07-06" "2026-08-03 2026-07-13" "2026-08-10 2026-07-20" "2026-08-17 2026-07-27" "2026-08-24 2026-08-03"; do
            set -- $spec; REF=$1; ASOF=$2
            echo "=== origin $REF (as-of $ASOF) ==="
            python3 scripts/run_mantis2_forecast.py \
              --target-data target-data/time-series.csv \
              --reference-date "$REF" --as-of-date "$ASOF" \
              --checkpoint-dir models/mantis2 --mantis-dir mantis2 \
              --output "backtest2/${REF}-GZNL-Mantis2.csv" \
              --summary "backtest2/${REF}-summary.json"
            python3 scripts/score_backtest.py \
              --forecast "backtest2/${REF}-GZNL-Mantis2.csv" \
              --target-data target-data/time-series.csv \
              --output "backtest2/${REF}-score.json"
          done

      - name: Build summary table
        run: |
          python3 - << 'PY'
          import json, glob
          lines = ["# Mantis 2 backtest -- Aug 2026 peak", "",
                   "Same protocol as the v1 backtest (data ends 3 weeks before each reference_date).",
                   "Actuals after the peak: 22.3 (Jul 27) -> 21.1 -> 21.2 -> 19.5 -> 15.8 -> 14.0 -> 12.5 -> 9.3 -> 7.2 -> 4.9 -> 3.4 -> 2.9 -> 1.9 -> 1.3", "",
                   "| origin (ref) | last obs | median h0 | median h2 | median h5 | MAE | mean WIS | 50% cov | 90% cov |",
                   "|---|---|---|---|---|---|---|---|---|"]
          for f in sorted(glob.glob("backtest2/*-score.json")):
              ref = f.split("/")[-1][:10]
              s = json.load(open(f))
              summ = json.load(open(f"backtest2/{ref}-summary.json"))
              p = s["pooled"] or {}
              med = summ["median_by_horizon"]
              lines.append(f"| {ref} | {summ['last_observed_value']}% | {med.get('0', '-')} | {med.get('2', '-')} | {med.get('5', '-')} | {p.get('mae_median', '-')} | {p.get('mean_wis', '-')} | {p.get('coverage_50', '-')} | {p.get('coverage_90', '-')} |")
          lines += ["",
                    "v1 on the same origins: MAE 6.78 / 2.70 / 3.27 / 4.71 / 3.58; mean WIS 29.13 / 35.22 / 40.25 / 40.89 / 33.51.",
                    "Flat last-value baseline on the 2026-08-24 origin: MAE 8.07, mean WIS 86.34.",
                    "Did the median turn down at horizon 2-3? Compare median h2/h5 with last obs above."]
          open("backtest2/BACKTEST-SUMMARY.md", "w").write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY

      - name: Upload backtest as artifact (for review only)
        uses: actions/upload-artifact@v4
        with:
          name: mantis2-backtest-aug2026
          path: backtest2/
          retention-days: 30

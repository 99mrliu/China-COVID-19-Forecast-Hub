# Mantis 2 weekly COVID-positivity forecast -- TEST VERSION
#
# Status: MANUAL-ONLY test. Do NOT enable the schedule below until:
#   1. the August-2026 backtest (mantis2-backtest.yaml) has been run
#      and compared with v1 on the same origins,
#   2. the user has reviewed the backtest and the first live run,
#   3. the GZNL-Mantis2 model metadata has been registered upstream.
#
# What it does NOT do (by design, for now):
#   - no scheduled runs (the `schedule:` block is commented out)
#   - no push to any branch, no pull request to upstream,
#     no commit of the forecast CSV. The CSV is only uploaded
#     as a workflow artifact for the user to download and review.
#   - no change to the upstream repo dailypartita/China-Infectious-
#     Disease-Forecast-Hub.
#
# How to run it by hand (after the workflow file is on a branch):
#   Actions -> "Mantis 2 forecast (manual test only)" -> Run workflow
#   -> reference_date: next Monday, e.g. 2026-11-23
#   -> download the `mantis2-forecast-<date>` artifact, run
#      scripts/validate_hub_csv.py on the CSV, check the medians.
#
# Mantis 2 notes (v2.0.0, Chronos-2 backbone):
#   - 21 native quantiles, 16-week horizon; only the first 8 steps
#     map into Hub horizons -1..6 (2-week data lag), the rest are
#     discarded. Only Hub quantiles 0.025/0.975 are interpolated
#     (interior); the 0.01/0.99 tails are native.
#   - Context is the last 512 weeks (the series only has ~205).
#   - Checkpoint is ~478 MB (model.safetensors + config.json),
#     cached between runs under key mantis-weights-v2.
#
name: Mantis 2 forecast (manual test only)

on:
  workflow_dispatch:
    inputs:
      reference_date:
        description: "Round reference_date (a Monday, YYYY-MM-DD)"
        required: true
        default: "2026-11-23"
  # schedule:  # <-- KEEP COMMENTED OUT until the user approves weekly runs
  #   - cron: "0 10 * * 3"  # Wednesdays 10:00 UTC = 18:00 Beijing

permissions:
  contents: read  # test version: read-only, no push / no PR

jobs:
  forecast:
    runs-on: ubuntu-24.04  # 4 vCPU, 16 GB RAM, 14 GB SSD
    timeout-minutes: 120
    steps:
      - name: Check out this fork
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Cache Mantis 2 checkpoint
        id: cache-weights
        uses: actions/cache@v4
        with:
          path: models/mantis2
          # If the cache misses (first run, or evicted after 7 idle
          # days), the next step downloads the checkpoint again.
          key: mantis-weights-v2
          restore-keys: |
            mantis-weights-v2-

      - name: Install torch (CPU only) + Mantis 2 deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install -r scripts/requirements.txt
          python -m pip install "mantis[v2] @ git+https://github.com/carsondudley1/Mantis.git@mantis-v2.0.0"

      - name: Download Mantis 2 checkpoint (only on cache miss)
        if: steps.cache-weights.outputs.cache-hit != 'true'
        run: |
          mkdir -p models/mantis2
          release_url="https://github.com/carsondudley1/Mantis/releases/download/mantis-v2.0.0"
          curl -fL "$release_url/config.json" -o models/mantis2/config.json
          curl -fL "$release_url/model.safetensors" -o models/mantis2/model.safetensors
          ls -lh models/mantis2/

      - name: Clone Mantis 2 code (not vendored in the fork)
        run: |
          git clone --depth 1 --branch mantis-2-release https://github.com/carsondudley1/Mantis.git mantis2
          ls mantis2/mantis/v2/

      - name: Fetch latest Hub target data from upstream
        run: |
          mkdir -p target-data
          curl -sL -o target-data/time-series.csv \
            https://raw.githubusercontent.com/dailypartita/China-Infectious-Disease-Forecast-Hub/main/target-data/time-series.csv
          python3 -c "
          import pandas as pd
          df = pd.read_csv('target-data/time-series.csv', parse_dates=['target_end_date'])
          g = df[df['target'] == 'wk inc covid prop ili'].sort_values('target_end_date')
          print(f\"COVID weeks: {len(g)}, last: {g['target_end_date'].max().date()} = {g['observation'].iloc[-1]}%\")
          "

      - name: Run Mantis 2 and convert to Hub format
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 scripts/run_mantis2_forecast.py \
            --target-data target-data/time-series.csv \
            --reference-date "${{ inputs.reference_date }}" \
            --checkpoint-dir models/mantis2 \
            --mantis-dir mantis2 \
            --output "model-output/GZNL-Mantis2/${{ inputs.reference_date }}-GZNL-Mantis2.csv" \
            --summary "forecast-summary-mantis2-${{ inputs.reference_date }}.json"
          cat "forecast-summary-mantis2-${{ inputs.reference_date }}.json"

      - name: Validate Hub format locally
        run: |
          python3 scripts/validate_hub_csv.py \
            --model-id GZNL-Mantis2 \
            "model-output/GZNL-Mantis2/${{ inputs.reference_date }}-GZNL-Mantis2.csv"

      - name: Upload forecast as artifact (for review only)
        uses: actions/upload-artifact@v4
        with:
          name: mantis2-forecast-${{ inputs.reference_date }}
          path: |
            model-output/GZNL-Mantis2/${{ inputs.reference_date }}-GZNL-Mantis2.csv
            forecast-summary-mantis2-${{ inputs.reference_date }}.json
          retention-days: 30

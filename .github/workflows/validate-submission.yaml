name: Hub Submission Validation (R)

# Validates the model output and model metadata files in a pull request and
# saves the result. The companion workflow, validate-submission-comment, posts
# the result on the pull request once this one finishes. Both follow the
# official hubverse-actions setup:
#
#   https://github.com/hubverse-org/hubverse-actions/tree/main/validate-submission
#
# The companion finds this workflow by the `name:` above. Renaming one without
# the other stops results being posted.

on:
  workflow_dispatch:
  pull_request:
    branches: main
    paths:
      - 'model-output/**'
      - 'model-metadata/*'
      - '!**README**'

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-submission:
    # A fork's own copy of the hub does not need validating.
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hubverse-org/hubverse-actions/validate-submission@v2
        with:
          summary: true
          # This hub enforces its submission window (submissions_due in
          # tasks.json) and allows corrections to previously submitted files.
          skip_submit_window_check: false
          file_modification_check: none
